name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: Annotation — ESLint issues found
        if: failure()
        run: |
          echo "::error::ESLint issues detected. Run \`npm run lint:fix\` to auto-fix linting errors."

      - name: Annotation — Prettier issues found
        if: failure()
        run: |
          echo "::error::Prettier formatting issues detected. Run \`npm run format\` to auto-format the codebase."

      - name: Fail workflow if issues found
        if: failure()
        run: |
          echo "::error::Lint or format check failed. Please fix the issues listed above and re-run the workflow."
          exit 1